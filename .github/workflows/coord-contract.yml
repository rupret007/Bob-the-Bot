name: Coordination contract

on:
  pull_request:
    paths:
      - ".github/ISSUE_TEMPLATE/coord.md"
      - ".github/workflows/coord-contract.yml"
      - "COORDINATION.md"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - ".github/ISSUE_TEMPLATE/coord.md"
      - ".github/workflows/coord-contract.yml"
      - "COORDINATION.md"
      - "README.md"
      - "docs/**"
      - "tools/**"
      - "tests/**"

permissions:
  contents: read

jobs:
  audit-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile validator
        run: python -m compileall -q tools tests
      - name: Test fail-closed contract
        run: python -m unittest discover -s tests -p "test_*.py" -v
